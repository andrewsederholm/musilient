# Image pipeline for andrewsederholm/musilient.
#
# Publishes ghcr.io/andrewsederholm/musilient (linux/amd64, the slim "runtime"
# image) on every push to main:
#   :latest, :main  -> newest build of main
#   :sha-<commit>   -> immutable tag, pin this in production / roll back to it
#
# No tests run first (deliberate choice). This is the only workflow; the
# inherited upstream ones (ci, docker, release, home-assistant) were removed.

name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push image
    # Only run in the main repo, not in forks of it.
    if: github.repository == 'andrewsederholm/musilient'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # What the server reports in Settings › About and /api/server:
      # the upstream release it is based on plus the fork commit,
      # e.g. 0.1.218-fork-107b5b4. Display only; nothing compares it.
      - name: Version
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          v="${base}-fork-${GITHUB_SHA::7}"
          echo "value=$v" >> "$GITHUB_OUTPUT"; echo "$v"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/andrewsederholm/musilient
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: SLOPIFY_VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
